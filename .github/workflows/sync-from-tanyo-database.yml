name: Sync from TanyoDatabase

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-tanyo-database
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out self-hosted repository
        uses: actions/checkout@v4

      - name: Pull source repository
        env:
          SOURCE_REPO_READ_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
        run: |
          test -n "$SOURCE_REPO_READ_TOKEN" || {
            echo "SOURCE_REPO_READ_TOKEN is not configured."
            exit 1
          }
          git clone --branch master "https://x-access-token:${SOURCE_REPO_READ_TOKEN}@github.com/magnusminds/TanyoDatabase.git" "$RUNNER_TEMP/source"

      - name: Copy source and remove table masking
        run: |
          source="$RUNNER_TEMP/source"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$source/" "$GITHUB_WORKSPACE/"

          find "$GITHUB_WORKSPACE/TanyoAppDB/Tables" "$GITHUB_WORKSPACE/TanyoLogsDB/Tables" \
            -type f -name '*.sql' -print0 |
            xargs -0 perl -0pi -e "s/\s+MASKED\s+WITH\s*\(\s*FUNCTION\s*=\s*'[^']*'\s*\)//gi"

          if grep -R -n -E 'MASKED[[:space:]]+WITH' "$GITHUB_WORKSPACE/TanyoAppDB/Tables" "$GITHUB_WORKSPACE/TanyoLogsDB/Tables"; then
            echo "Table masking was not fully removed."
            exit 1
          fi

      - name: Add encryption to programmable objects
        run: |
          for directory in \
            "$GITHUB_WORKSPACE/TanyoAppDB/StoredProcedures" \
            "$GITHUB_WORKSPACE/TanyoAppDB/Functions" \
            "$GITHUB_WORKSPACE/TanyoAppDB/Views" \
            "$GITHUB_WORKSPACE/TanyoLogsDB/StoredProcedures" \
            "$GITHUB_WORKSPACE/TanyoLogsDB/Functions" \
            "$GITHUB_WORKSPACE/TanyoLogsDB/Views"; do
            if [ -d "$directory" ]; then
              find "$directory" -type f -name '*.sql' -print0 |
                xargs -0 perl -0pi -e 's/^[ \t]*WITH[ \t]+ENCRYPTION(?:[ \t]*\r?\n[ \t]*)?AS[ \t]*$/WITH ENCRYPTION\nAS/gim; if (!/^[ \t]*WITH[ \t]+ENCRYPTION[ \t]*$/im) { s/\r?\n[ \t]*AS[ \t]*\r?\n/\nWITH ENCRYPTION\nAS\n/i; }'
            fi
          done

      - name: Commit and push synchronized changes
        run: |
          source_sha=$(git -C "$RUNNER_TEMP/source" rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No synchronized changes to push."
            exit 0
          fi
          git commit -m "Sync from TanyoDatabase ${source_sha}"
          git pull --rebase origin master
          for attempt in 1 2 3; do
            if git push origin master; then
              exit 0
            fi
            git pull --rebase origin master
          done
          echo "Unable to push after retries."
          exit 1
